name: CI

on:
    pull_request:
        branches: [main]
    push:
        branches: [main]

permissions:
    contents: read

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    validate:
        name: Lint, typecheck, and build
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: portfolio-coursse
        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 11.20.0

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm
                  cache-dependency-path: portfolio-coursse/pnpm-lock.yaml

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Lint
              run: pnpm lint

            - name: Generate Next.js route types
              run: pnpm exec next typegen

            - name: Typecheck
              run: pnpm exec tsc --noEmit

            - name: Build
              run: pnpm build
              env:
                  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
                  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-publishable-key
